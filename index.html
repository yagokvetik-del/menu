<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <title>Menu Circular</title>


  <link rel="stylesheet" href="estilo.css">
</head>


<body>
  <h1>Menu Circular</h1>


  <div class="menu">
    <!-- Botão central para abrir e fechar o menu. -->
    <button
      id="alternar"
      type="button"
      aria-label="Abrir menu"
      aria-expanded="false"
      aria-controls="opcoes"
    >
      <span aria-hidden="true">+</span>
    </button>


    <!-- As opções ficam bloqueadas enquanto o menu está fechado. -->
    <nav id="opcoes" aria-label="Menu principal" inert>
      <a
        href="https://www.uol.com.br/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="UOL"
        title="Abrir UOL"
        style="--x: -105px; --y: 0px; --cor: #ff0077;"
      >
        <span aria-hidden="true">⌂</span>
      </a>


      <a
        href="https://www.terra.com.br/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Terra"
        title="Abrir Terra"
        style="--x: -74px; --y: -74px; --cor: #eaff00;"
      >
        <span aria-hidden="true">🌎</span>
      </a>


      <a
        href="https://www.youtube.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="YouTube"
        title="Abrir YouTube"
        style="--x: 0px; --y: -105px; --cor: #00ff55;"
      >
        <span aria-hidden="true">▶</span>
      </a>


      <a
        href="https://www.google.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Google"
        title="Abrir Google"
        style="--x: 74px; --y: -74px; --cor: #ff00ff;"
      >
        <span aria-hidden="true">🔎</span>
      </a>


      <a
        href="https://www.instagram.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
        title="Abrir Instagram"
        style="--x: 105px; --y: 0px; --cor: #00ccff;"
      >
        <span aria-hidden="true">📷</span>
      </a>


      <a
        href="https://www.globo.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Globo"
        title="Abrir Globo"
        style="--x: 74px; --y: 74px; --cor: #ffaa00;"
      >
        <span aria-hidden="true">📰</span>
      </a>


      <a
        href="https://github.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
        title="Abrir GitHub"
        style="--x: 0px; --y: 105px; --cor: #9933ff;"
      >
        <span aria-hidden="true">💻</span>
      </a>


      <a
        href="https://www.wikipedia.org/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Wikipédia"
        title="Abrir Wikipédia"
        style="--x: -74px; --y: 74px; --cor: #00ffbb;"
      >
        <span aria-hidden="true">📚</span>
      </a>
    </nav>
  </div>


  <p id="mensagem" aria-live="polite">
    Clique em + para abrir o menu.
  </p>


  <script src="script.js"></script>
</body>
</html>
